<!-- Video View Tab (Full Main Area YouTube Video Player) -->
<section class="tab-content" id="tab-video-view">
    <div class="video-full-wrapper">
        <div class="video-full-screen" id="video-theater-screen">
            <div class="video-placeholder-state" id="video-placeholder">
                <i class="fa-solid fa-film placeholder-icon"></i>
                <p>Nessun video in riproduzione. Seleziona un brano YouTube per iniziare!</p>
            </div>
            <iframe id="main-yt-iframe" class="hidden" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
        </div>
        <div class="video-full-bar">
            <div class="video-full-info">
                <h1 id="video-title-display">Nessun video selezionato</h1>
                <p id="video-artist-display">Scegli un brano dalla ricerca per avviare la riproduzione</p>
            </div>
        </div>
    </div>
</section>
