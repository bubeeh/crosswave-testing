<!-- Catalog / Artist-Label Exploration View (Bandcamp + YouTube) -->
<section class="tab-content" id="tab-catalog">
    <div class="catalog-view-container" style="padding-bottom: 40px;">
        <div class="catalog-header glassmorphic" style="display: flex; gap: 24px; align-items: center; padding: 24px; border-radius: 20px; margin-bottom: 24px;">
            <img id="catalog-view-cover" src="" alt="Catalog cover"
                 style="width: 140px; height: 140px; border-radius: 16px; object-fit: cover; border: 1px solid var(--border-color); flex-shrink: 0;"
                 onerror="this.src='https://images.unsplash.com/photo-1614680376593-902f74fa0d41?w=300'">
            <div style="min-width: 0;">
                <div class="album-badge" id="catalog-view-badge"><i class="fa-solid fa-compass"></i> CATALOGO</div>
                <h1 id="catalog-view-title" style="font-size: 1.8rem; font-weight: 800; margin-top: 10px; color: #fff;">Catalogo</h1>
                <div id="catalog-view-meta" style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 6px;">Caricamento...</div>
                <div id="catalog-view-related" style="margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap;"></div>
            </div>
        </div>

        <div id="catalog-view-sections">
            <div class="search-placeholder-state">
                <i class="fa-solid fa-compass placeholder-icon"></i>
                <p>Seleziona un artista, una label o un canale per esplorarne le uscite.</p>
            </div>
        </div>
    </div>
</section>
