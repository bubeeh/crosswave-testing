<!-- Mixcloud DJ Set & Radio Show View -->
<section class="tab-content" id="tab-mixcloud-view">
    <div class="mixcloud-view-container glassmorphic">
        <div class="mc-view-header">
            <div class="mc-badge"><i class="fa-brands fa-mixcloud"></i> MIXCLOUD DJ SET</div>
            <h1 id="mc-view-title">Seleziona un DJ Set / Radio Show</h1>
            <h2 id="mc-view-artist">Sfoglia la ricerca o le tue playlist</h2>
        </div>
        <div class="mc-embed-card glassmorphic" style="padding: 20px; margin-top: 20px; border-radius: 20px;">
            <div class="mc-embed-box" id="mc-embed-wrapper" style="width: 100%; border-radius: 14px; overflow: hidden;">
                <iframe id="mc-player-iframe" 
                        src="" 
                        allow="autoplay"
                        style="width: 100%; height: 400px; border: none; border-radius: 14px;">
                </iframe>
            </div>
        </div>
    </div>
</section>
