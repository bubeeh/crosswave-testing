<!-- Dedicated Album / Release Detail View -->
<section class="tab-content" id="tab-album-detail">
    <div class="album-detail-container">
        <button class="album-back-link" id="album-back-btn">
            <i class="fa-solid fa-arrow-left"></i> Risultati
        </button>

        <div class="album-detail-header">
            <div class="album-cover-wrapper">
                <img src="" alt="Album Cover" class="album-detail-cover" id="album-view-cover">
            </div>
            <div class="album-detail-meta">
                <div class="album-source-label" id="album-view-badge"><i class="fa-brands fa-bandcamp"></i> ALBUM · BANDCAMP</div>
                <h1 class="album-title-text" id="album-view-title">Nome Album</h1>
                <h2 class="album-artist-text" id="album-view-artist">Artista</h2>
                <div class="album-stats-row">
                    <span id="album-view-count">0 tracce</span>
                    <span class="album-meta-sep">&middot;</span>
                    <span id="album-view-duration">0 min</span>
                    <span class="album-meta-sep hidden" id="album-view-date-sep">&middot;</span>
                    <span id="album-view-date" class="hidden"></span>
                </div>
                <div class="album-actions-row">
                    <button class="btn btn-cyan btn-album-primary" id="btn-album-play-all">
                        <i class="fa-solid fa-play"></i> Riproduci tutto
                    </button>
                    <button class="btn btn-secondary" id="btn-album-add-playlist">
                        <i class="fa-solid fa-folder-plus"></i> Playlist
                    </button>
                    <a href="#" target="_blank" rel="noopener noreferrer" class="album-text-link hidden" id="btn-album-external-source">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i> Apri su Bandcamp
                    </a>
                    <button class="album-text-link hidden" id="btn-album-catalog">
                        <i class="fa-solid fa-compass"></i> Esplora catalogo
                    </button>
                </div>
            </div>
        </div>

        <div class="album-detail-body">
            <div class="album-tracks-section">
                <div class="album-tracks-header">
                    <span class="album-tracks-col-num">#</span>
                    <span class="album-tracks-col-title">Titolo</span>
                    <span class="album-tracks-col-dur"><i class="fa-regular fa-clock"></i></span>
                </div>
                <div class="album-view-tracks-list" id="album-view-tracks-list">
                    <!-- Album tracks list injected here -->
                </div>
            </div>

            <aside class="album-info-section" id="album-info-box">
                <h3 class="album-info-title">Info e crediti</h3>

                <div class="album-info-block" id="album-notes-block">
                    <h4 class="album-info-label">Note sull'album</h4>
                    <div id="album-view-description" class="album-info-text"></div>
                    <button class="album-read-more hidden" id="album-read-more">Leggi tutto</button>
                </div>

                <div class="album-info-block" id="album-credits-block">
                    <h4 class="album-info-label">Crediti</h4>
                    <div id="album-view-credits" class="album-credits-list"></div>
                </div>
            </aside>
        </div>
    </div>
</section>
