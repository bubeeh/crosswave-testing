<!-- Dedicated Bandcamp-style Album / Release Detail View -->
<section class="tab-content" id="tab-album-detail">
    <div class="album-detail-container">
        <div class="album-detail-header glassmorphic">
            <div class="album-cover-wrapper">
                <img src="" alt="Album Cover" class="album-detail-cover" id="album-view-cover">
                <div class="album-cover-glow" id="album-view-glow"></div>
            </div>
            <div class="album-detail-meta">
                <div class="album-badge"><i class="fa-brands fa-bandcamp"></i> ALBUM RELEASE</div>
                <h1 class="album-title-text" id="album-view-title">Nome Album</h1>
                <h2 class="album-artist-text" id="album-view-artist">Artista</h2>
                <div class="album-stats-row">
                    <span id="album-view-count">0 tracce</span> • <span id="album-view-duration">0 min</span>
                </div>
                <div class="album-actions-row">
                    <button class="btn btn-cyan" id="btn-album-play-all">
                        <i class="fa-solid fa-play"></i> Riproduci Tutto
                    </button>
                    <button class="btn btn-secondary" id="btn-album-download-all">
                        <i class="fa-solid fa-cloud-arrow-down"></i> Scarica con Soundload
                    </button>
                </div>
            </div>
        </div>

        <div class="album-detail-body">
            <div class="album-tracks-section glassmorphic">
                <h3 class="section-subtitle">Tracce dell'Album</h3>
                <div class="search-results-list" id="album-view-tracks-list">
                    <!-- Album tracks list injected here -->
                </div>
            </div>
            
            <div class="album-info-section glassmorphic hidden" id="album-info-box" style="margin-top: 24px; padding: 24px; border-radius: 16px; font-family: 'Futura', 'Century Gothic', 'Tw Cen MT', -apple-system, sans-serif;">
                <h3 class="section-subtitle" style="font-family: 'Futura', 'Century Gothic', sans-serif; font-size: 1.1rem; letter-spacing: 1px; margin-bottom: 20px; color: var(--accent-cyan);">
                    <i class="fa-solid fa-circle-info me-2"></i> Info & Crediti Release
                </h3>
                <div class="album-info-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: start;">
                    <!-- Colonna Sinistra: Note sull'Album / Description -->
                    <div class="album-info-col" id="album-description-col">
                        <h4 style="font-size: 0.82rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); margin-bottom: 12px; font-weight: 700;">
                            Note sull'Album
                        </h4>
                        <div id="album-view-description" style="font-size: 0.82rem; line-height: 1.6; color: var(--text-secondary); white-space: pre-wrap; font-family: 'Futura', 'Century Gothic', sans-serif;">
                            <!-- Release notes injected here -->
                        </div>
                    </div>

                    <!-- Colonna Destra: Crediti e Dettagli di Produzione -->
                    <div class="album-credits-col" id="album-credits-col">
                        <h4 style="font-size: 0.82rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); margin-bottom: 12px; font-weight: 700;">
                            Crediti & Rilascio
                        </h4>
                        <div id="album-view-credits" style="font-size: 0.82rem; line-height: 1.6; color: var(--text-secondary); white-space: pre-wrap; font-family: 'Futura', 'Century Gothic', sans-serif;">
                            <!-- Credits & metadata injected here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
