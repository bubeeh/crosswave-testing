services:
  crossplayer:
    build: .
    container_name: crosswave_player
    ports:
      - "5002:5002"
    volumes:
      # Persistenza dei DB (app, cache resolver, libreria utente/raccomandazioni)
      - ./crosswave.db:/app/crosswave.db
      - ./resolver_cache.db:/app/resolver_cache.db
      - ./user.db:/app/user.db
    environment:
      - PORT=5002
      - FLASK_DEBUG=0
      - PYTHONUNBUFFERED=1
      - SECRET_KEY=crosswave_hybrid_production_secret_2026
    restart: unless-stopped
