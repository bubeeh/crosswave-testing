line-length = 120
target-version = "py311"
exclude = ["__pycache__", ".git", "player_engine/fixtures", "downloads"]

[lint]
select = ["E", "F", "I", "B"]
# E402: app.py importa dopo sys.path.insert (pattern intenzionale del progetto)
# E701: alcune tabelle compatte (palinsesto radio) su una riga
ignore = ["E501", "E402", "E701"]
